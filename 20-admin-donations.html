
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Donations - Food Connect</title>

    <link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="enhance.css">

    <style>

        .admin-page {
            min-height: 100vh;
            padding: 25px;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            font-size: 34px;
        }

        .header-title h1 {
            margin: 0;
            font-size: 25px;
        }

        .header-title p {
            margin: 4px 0 0;
            color: #777;
            font-size: 14px;
        }

        .back-button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .summary-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }

        .summary-number {
            font-size: 28px;
            font-weight: 700;
        }

        .summary-label {
            color: #777;
            margin-left: 7px;
        }

        .search-box {
            background: white;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .donation-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);
            gap: 18px;
        }

        .donation-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }

        .donation-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .food-icon {
            font-size: 30px;
        }

        .food-name {
            font-size: 19px;
            font-weight: 700;
            margin-top: 5px;
        }

        .category {
            color: #777;
            font-size: 13px;
            margin-top: 3px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            height: fit-content;
        }

        .status-available {
            background: #e8f7ed;
            color: #18733a;
        }

        .status-matched {
            background: #e8f0ff;
            color: #2454a6;
        }

        .status-pending {
            background: #fff4df;
            color: #9a6500;
        }

        .status-other {
            background: #eeeeee;
            color: #555;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #777;
        }

        .detail-value {
            font-weight: 600;
            text-align: right;
        }

        .message-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .message-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .error {
            color: #b42318;
        }

        @media (max-width: 750px) {

            .donation-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .admin-page {
                padding: 15px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .detail-row {
                flex-direction: column;
                gap: 3px;
            }

            .detail-value {
                text-align: left;
            }

        }

    </style>

</head>


<body>


<div class="admin-page">

<div class="admin-container">


    <!-- HEADER -->

    <div class="page-header">

        <div class="header-left">

            <div class="header-icon">
                🍱
            </div>

            <div class="header-title">

                <h1>
                    Donation Management
                </h1>

                <p>
                    Monitor food donations
                </p>

            </div>

        </div>


        <button
            class="back-button"
            onclick="goBack()"
        >
            ← Dashboard
        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary-card">

        <span
            class="summary-number"
            id="donationCount"
        >
            0
        </span>

        <span class="summary-label">
            Total Donations
        </span>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search food, category, address or status..."
            oninput="filterDonations()"
        >

    </div>


    <!-- DONATIONS -->

    <div
        id="donationGrid"
        class="donation-grid"
    >

        <div class="message-box">

            <div class="message-icon">
                ⏳
            </div>

            Loading donations...

        </div>

    </div>


</div>

</div>


<script>


let allDonations = [];


// ==========================================
// LOAD DONATIONS
// ==========================================

async function loadDonations() {

    const grid =
        document.getElementById(
            "donationGrid"
        );


    try {

        const response =
            await fetch(
                "http://localhost:5000/api/admin/donations"
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load donations"
            );

        }


        allDonations =
            data.donations || [];


        document.getElementById(
            "donationCount"
        ).textContent =
            allDonations.length;


        displayDonations(
            allDonations
        );


    } catch (error) {

        console.error(
            "Donation Loading Error:",
            error
        );


        grid.innerHTML = `

            <div class="message-box">

                <div class="message-icon">
                    ❌
                </div>

                <div class="error">
                    Failed to load donations
                </div>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


// ==========================================
// DISPLAY DONATIONS
// ==========================================

function displayDonations(
    donations
) {

    const grid =
        document.getElementById(
            "donationGrid"
        );


    if (donations.length === 0) {

        grid.innerHTML = `

            <div class="message-box">

                <div class="message-icon">
                    🍱
                </div>

                <strong>
                    No donations found
                </strong>

            </div>

        `;

        return;

    }


    grid.innerHTML = "";


    donations.forEach(
        function(donation) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "donation-card";


            const status =
                donation.status ||
                "available";


            const statusClass =
                getStatusClass(status);


            card.innerHTML = `

                <div class="donation-header">

                    <div>

                        <div class="food-icon">
                            🍱
                        </div>

                        <div class="food-name">
                            ${escapeHTML(
                                donation.foodName
                            )}
                        </div>

                        <div class="category">
                            ${escapeHTML(
                                donation.category
                            )}
                        </div>

                    </div>


                    <span
                        class="status ${statusClass}"
                    >
                        ${escapeHTML(status)}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        ⚖️ Quantity
                    </span>

                    <span class="detail-value">
                        ${donation.quantity} kg
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        📍 Address
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            donation.address
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        🕐 Preparation
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            donation.preparationTime ||
                            "Not specified"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        ⏰ Expiry
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            donation.expiryTime ||
                            "Not specified"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        🌱 Freshness
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            donation.freshness ||
                            "Not specified"
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        ⭐ Priority
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            donation.priority ||
                            "Normal"
                        )}
                    </span>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


// ==========================================
// FILTER
// ==========================================

function filterDonations() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const filtered =
        allDonations.filter(
            function(donation) {

                const text = `

                    ${donation.foodName}

                    ${donation.category}

                    ${donation.address}

                    ${donation.status}

                    ${donation.freshness}

                    ${donation.priority}

                `.toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    displayDonations(
        filtered
    );

}


// ==========================================
// STATUS STYLE
// ==========================================

function getStatusClass(status) {

    const value =
        String(status)
        .toLowerCase();


    if (value === "available") {

        return "status-available";

    }


    if (value === "matched") {

        return "status-matched";

    }


    if (value === "pending") {

        return "status-pending";

    }


    return "status-other";

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==========================================
// BACK
// ==========================================

function goBack() {

    window.location.href =
        "18-admin-dashboard.html";

}


// ==========================================
// START
// ==========================================

loadDonations();

</script>


<script src="enhance.js"></script>
</body>

</html>
