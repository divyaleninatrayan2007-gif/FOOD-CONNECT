
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NGO Requests - Food Connect</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="enhance.css">

<style>

.admin-page {
    min-height: 100vh;
    padding: 25px;
}

.admin-container {
    max-width: 1100px;
    margin: auto;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-icon {
    font-size: 34px;
}

.header-title h1 {
    margin: 0;
    font-size: 25px;
}

.header-title p {
    margin: 4px 0 0;
    color: #777;
    font-size: 14px;
}

.back-button {
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.summary-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow:
        0 5px 20px rgba(0,0,0,0.07);
}

.summary-number {
    font-size: 28px;
    font-weight: 700;
}

.summary-label {
    color: #777;
    margin-left: 7px;
}

.search-box {
    background: white;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow:
        0 5px 20px rgba(0,0,0,0.06);
}

.search-box input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

.request-grid {
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);
    gap: 18px;
}

.request-card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow:
        0 5px 20px rgba(0,0,0,0.07);
}

.request-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.request-icon {
    font-size: 30px;
}

.ngo-name {
    font-size: 19px;
    font-weight: 700;
    margin-top: 5px;
}

.food-type {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    height: fit-content;
}

.status-pending {
    background: #fff4df;
    color: #9a6500;
}

.status-matched {
    background: #e8f0ff;
    color: #2454a6;
}

.status-other {
    background: #eeeeee;
    color: #555;
}

.urgency-high {
    color: #b42318;
}

.urgency-medium {
    color: #9a6500;
}

.urgency-normal {
    color: #18733a;
}

.detail-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 9px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.detail-row:last-child {
    border-bottom: none;
}

.detail-label {
    color: #777;
}

.detail-value {
    font-weight: 600;
    text-align: right;
}

.message-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

.message-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.error {
    color: #b42318;
}

@media (max-width: 750px) {

    .request-grid {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .admin-page {
        padding: 15px;
    }

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }

    .detail-row {
        flex-direction: column;
        gap: 3px;
    }

    .detail-value {
        text-align: left;
    }

}

</style>

</head>


<body>


<div class="admin-page">

<div class="admin-container">


<!-- HEADER -->

<div class="page-header">

    <div class="header-left">

        <div class="header-icon">
            🏢
        </div>

        <div class="header-title">

            <h1>
                NGO Food Requests
            </h1>

            <p>
                Monitor food requirements from NGOs
            </p>

        </div>

    </div>


    <button
        class="back-button"
        onclick="goBack()"
    >
        ← Dashboard
    </button>

</div>


<!-- SUMMARY -->

<div class="summary-card">

    <span
        class="summary-number"
        id="requestCount"
    >
        0
    </span>

    <span class="summary-label">
        Total NGO Requests
    </span>

</div>


<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Search NGO, food, category, address or status..."
        oninput="filterRequests()"
    >

</div>


<!-- REQUESTS -->

<div
    id="requestGrid"
    class="request-grid"
>

    <div class="message-box">

        <div class="message-icon">
            ⏳
        </div>

        Loading requests...

    </div>

</div>


</div>

</div>


<script>


let allRequests = [];


// ==========================================
// LOAD REQUESTS
// ==========================================

async function loadRequests() {

    const grid =
        document.getElementById(
            "requestGrid"
        );


    try {

        const response =
            await fetch(
                "http://localhost:5000/api/admin/requests"
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load requests"
            );

        }


        allRequests =
            data.requests || [];


        document.getElementById(
            "requestCount"
        ).textContent =
            allRequests.length;


        displayRequests(
            allRequests
        );


    } catch (error) {

        console.error(
            "Request Loading Error:",
            error
        );


        grid.innerHTML = `

            <div class="message-box">

                <div class="message-icon">
                    ❌
                </div>

                <div class="error">
                    Failed to load NGO requests
                </div>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>

        `;

    }

}


// ==========================================
// DISPLAY REQUESTS
// ==========================================

function displayRequests(requests) {

    const grid =
        document.getElementById(
            "requestGrid"
        );


    if (requests.length === 0) {

        grid.innerHTML = `

            <div class="message-box">

                <div class="message-icon">
                    🏢
                </div>

                <strong>
                    No NGO requests found
                </strong>

            </div>

        `;

        return;

    }


    grid.innerHTML = "";


    requests.forEach(
        function(request) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "request-card";


            const status =
                request.status ||
                "Pending";


            const statusClass =
                getStatusClass(status);


            const urgency =
                request.urgency ||
                "Normal";


            const urgencyClass =
                getUrgencyClass(
                    urgency
                );


            card.innerHTML = `

                <div class="request-header">

                    <div>

                        <div class="request-icon">
                            🏢
                        </div>

                        <div class="ngo-name">
                            ${escapeHTML(
                                request.ngoName
                            )}
                        </div>

                        <div class="food-type">
                            ${escapeHTML(
                                request.foodType
                            )}
                        </div>

                    </div>


                    <span
                        class="status ${statusClass}"
                    >
                        ${escapeHTML(status)}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        🍱 Category
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            request.category
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        ⚖️ Quantity
                    </span>

                    <span class="detail-value">
                        ${request.quantity} kg
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        👥 People
                    </span>

                    <span class="detail-value">
                        ${request.peopleCount}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        📅 Required Date
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            request.requiredDate
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        🕐 Required Time
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            request.requiredTime
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        📍 Address
                    </span>

                    <span class="detail-value">
                        ${escapeHTML(
                            request.address
                        )}
                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">
                        🚨 Urgency
                    </span>

                    <span
                        class="detail-value ${urgencyClass}"
                    >
                        ${escapeHTML(urgency)}
                    </span>

                </div>

            `;


            grid.appendChild(card);

        }
    );

}


// ==========================================
// FILTER
// ==========================================

function filterRequests() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const filtered =
        allRequests.filter(
            function(request) {

                const text = `

                    ${request.ngoName}

                    ${request.foodType}

                    ${request.category}

                    ${request.address}

                    ${request.status}

                    ${request.urgency}

                `.toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    displayRequests(
        filtered
    );

}


// ==========================================
// STATUS STYLE
// ==========================================

function getStatusClass(status) {

    const value =
        String(status)
        .toLowerCase();


    if (value === "pending") {

        return "status-pending";

    }


    if (value === "matched") {

        return "status-matched";

    }


    return "status-other";

}


// ==========================================
// URGENCY STYLE
// ==========================================

function getUrgencyClass(urgency) {

    const value =
        String(urgency)
        .toLowerCase();


    if (value === "high") {

        return "urgency-high";

    }


    if (value === "medium") {

        return "urgency-medium";

    }


    return "urgency-normal";

}


// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ==========================================
// BACK
// ==========================================

function goBack() {

    window.location.href =
        "18-admin-dashboard.html";

}


// ==========================================
// START
// ==========================================

loadRequests();

</script>


<script src="enhance.js"></script>
</body>

</html>
